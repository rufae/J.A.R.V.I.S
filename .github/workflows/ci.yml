name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.8.0"
      - name: Ruff check
        run: ruff check jarvis tests
      - name: Ruff format check
        run: ruff format --check jarvis tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Los tests cubren los módulos de lógica pura (parser, registro de
      # comandos, estado, memoria, config, planificador) y solo necesitan
      # stdlib + pytest: sin descargar whisper/pygame en cada run.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -q --cov=jarvis --cov-report=term
